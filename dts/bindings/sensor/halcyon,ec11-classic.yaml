description: |
  Upstream-ZMK two-line EC11 driver, vendored for the Halcyon encoder module rev 1.0 (ALPS EC12)

compatible: "halcyon,ec11-classic"

properties:
  label:
    type: string
    required: false
    deprecated: true
  a-gpios:
    type: phandle-array
    required: true
    description: A pin for the encoder
  b-gpios:
    type: phandle-array
    required: true
    description: A pin for the encoder
  resolution:
    type: int
    description: Number of pulses per tick
    deprecated: true
    required: false
  steps:
    type: int
    description: Number of pulses in one full rotation
    required: false
