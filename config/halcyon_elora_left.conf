# left half only (merged after the module's shield confs, so these win).
#
# TEST 2026-09-09: with both halves on battery, neither the touchpad nor the encoder produced a
# single event at the dongle; on USB both work. splitkb's coincell shield sets
# CONFIG_ZMK_EXT_POWER_DISABLE_WHEN_USB_DISCONNECTED=y (module commit 2054c04, 2026-09-08), which
# refuses to switch external power on whenever USB is absent. If the VIK module rail hangs off that
# switched supply, this is the cause. Override: allow it on battery and start with it on.
# Side effect on the coincell board: the orange LED is wired as an external-power indicator and
# will stay lit. Costs battery; revert once the root cause is confirmed.
CONFIG_ZMK_EXT_POWER_DISABLE_WHEN_USB_DISCONNECTED=n
CONFIG_ZMK_EXT_POWER_START=y

# Encoder module rev 1.0: use the vendored two-line driver (see halcyon_elora_left.overlay).
# mod_encoder_left.conf turns the fork's EC11 driver on, but with the node re-typed there is no
# alps,ec11 device left, and an unsatisfiable CONFIG_EC11=y aborts the build. Turn both off.
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n
CONFIG_EC11_CLASSIC=y
CONFIG_EC11_CLASSIC_TRIGGER_GLOBAL_THREAD=y
