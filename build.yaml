# This file generates the GitHub Actions matrix.
# Hardware: Halcyon Elora rev2, wireless controllers + dongle, coincell battery boards,
# left half: no module yet (e-paper display on the way), right half: Cirque Touchpad.
# TFT display and rev 1.0 encoder are not usable with the wireless controllers per splitkb:
# https://blog.splitkb.com/introducing-halcyon-wireless/
# See README.md for what each artifact is and where to flash it.
---
include:
  - board: halcyon_dongle//zmk
    shield: halcyon_elora_dongle mod_cirque_central
    artifact-name: halcyon_elora_dongle
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: studio-rpc-usb-uart
  - board: halcyon_wireless//zmk
    shield: halcyon_elora_left mod_battery_coincell
    artifact-name: halcyon_elora_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: halcyon_wireless//zmk
    shield: halcyon_elora_right mod_battery_coincell mod_cirque_hw_right
    artifact-name: halcyon_elora_right
  # Alternative left image for the e-paper display module (images: mountain, forest, cityscape).
  - board: halcyon_wireless//zmk
    shield: halcyon_elora_left mod_battery_coincell mod_display_epaper_mountain
    artifact-name: halcyon_elora_left_epaper
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: halcyon_wireless//zmk
    shield: settings_reset
    artifact-name: settings_reset_controller
  - board: halcyon_dongle//zmk
    shield: settings_reset
    artifact-name: settings_reset_dongle
  # Diagnosis builds: identical to the ones above plus USB logging (zmk-usb-logging snippet
  # adds the CDC-ACM serial device) at debug level. Dongle variant drops ZMK Studio because
  # both want the USB CDC port. Flash the normal images afterwards.
  - board: halcyon_dongle//zmk
    shield: halcyon_elora_dongle mod_cirque_central
    artifact-name: debug_halcyon_elora_dongle
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_LOG_LEVEL_DBG=y -DCONFIG_SENSOR_LOG_LEVEL_DBG=y -DCONFIG_INPUT_LOG_LEVEL_DBG=y
  - board: halcyon_wireless//zmk
    shield: halcyon_elora_left mod_battery_coincell
    artifact-name: debug_halcyon_elora_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_LOG_LEVEL_DBG=y -DCONFIG_SENSOR_LOG_LEVEL_DBG=y -DCONFIG_INPUT_LOG_LEVEL_DBG=y
  - board: halcyon_wireless//zmk
    shield: halcyon_elora_right mod_battery_coincell mod_cirque_hw_right
    artifact-name: debug_halcyon_elora_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_LOG_LEVEL_DBG=y -DCONFIG_SENSOR_LOG_LEVEL_DBG=y -DCONFIG_INPUT_LOG_LEVEL_DBG=y
